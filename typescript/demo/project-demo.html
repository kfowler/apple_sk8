<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK8 Project System Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #545b62;
        }

        button.danger {
            background: #dc3545;
        }

        button.danger:hover {
            background: #c82333;
        }

        .status {
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
        }

        .status-dirty {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }

        .canvas-container {
            border: 2px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            background: white;
        }

        canvas {
            display: block;
        }

        .info-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
        }

        .info-box h3 {
            margin-top: 0;
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .info-box li {
            padding: 5px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .info-box li:last-child {
            border-bottom: none;
        }

        .recent-projects {
            max-height: 300px;
            overflow-y: auto;
        }

        .recent-project {
            padding: 10px;
            background: white;
            border-radius: 4px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .recent-project:hover {
            background: #e9ecef;
        }

        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-info { color: #4ec9b0; }
        .log-warn { color: #dcdcaa; }
        .log-error { color: #f48771; }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SK8 Project System Demo</h1>

        <div id="autoSaveAlert" class="alert alert-info" style="display: none;">
            Auto-save is available! <button onclick="recoverAutoSave()" style="padding: 5px 10px; margin-left: 10px;">Recover</button>
        </div>

        <div class="controls">
            <button onclick="newProject()">New Project</button>
            <button onclick="openProject()">Open Project</button>
            <button onclick="saveProject()" id="saveBtn" disabled>Save Project</button>
            <button onclick="addActors()" id="addActorsBtn">Add Actors</button>
            <button class="secondary" onclick="exportJSON()">Export JSON</button>
            <button class="secondary" onclick="viewProject()">View Project Data</button>
            <button class="danger" onclick="clearProject()">Clear Project</button>
        </div>

        <div class="status" id="status">
            No project loaded. Click "New Project" to start.
        </div>

        <div class="info-panel">
            <div class="info-box">
                <h3>Project Stats</h3>
                <ul id="projectStats">
                    <li>No project loaded</li>
                </ul>
            </div>
            <div class="info-box">
                <h3>Recent Projects</h3>
                <div class="recent-projects" id="recentProjects">
                    No recent projects
                </div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="mainCanvas" width="800" height="600"></canvas>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script type="module">
        import {
            createProject,
            getProjectManager,
            SK8Stage,
            SK8Rectangle,
            SK8Circle,
            SK8Text,
            saveProjectToFile,
            hasAutoSave,
            recoverProjectFromAutoSave,
            getRecentProjects,
            exportProjectAsJSON,
            openProjectFromFilePicker,
            serializeProject,
        } from '../dist/sk8.js';

        // Initialize
        const canvas = document.getElementById('mainCanvas');
        const stage = new SK8Stage(canvas);
        const projectManager = getProjectManager();

        let currentProject = null;

        // Logging
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Update status
        function updateStatus() {
            const statusDiv = document.getElementById('status');
            const saveBtn = document.getElementById('saveBtn');

            if (currentProject) {
                const isDirty = projectManager.isDirty();
                const dirtyIndicator = isDirty ? ' (unsaved)' : '';
                statusDiv.textContent = `Project: ${currentProject.getName()} v${currentProject.getVersion()}${dirtyIndicator}`;
                statusDiv.className = isDirty ? 'status status-dirty' : 'status';
                saveBtn.disabled = false;
            } else {
                statusDiv.textContent = 'No project loaded. Click "New Project" to start.';
                statusDiv.className = 'status';
                saveBtn.disabled = true;
            }

            updateStats();
            updateRecentProjects();
        }

        // Update project stats
        function updateStats() {
            const statsDiv = document.getElementById('projectStats');

            if (currentProject) {
                const stats = currentProject.getStats();
                statsDiv.innerHTML = `
                    <li>Stages: ${stats.stageCount}</li>
                    <li>Actors: ${stats.actorCount}</li>
                    <li>Assets: ${stats.assetCount}</li>
                    <li>Scripts: ${stats.scriptCount}</li>
                `;
            } else {
                statsDiv.innerHTML = '<li>No project loaded</li>';
            }
        }

        // Update recent projects
        function updateRecentProjects() {
            const recentDiv = document.getElementById('recentProjects');
            const recent = getRecentProjects();

            if (recent.length === 0) {
                recentDiv.innerHTML = 'No recent projects';
                return;
            }

            recentDiv.innerHTML = recent.map(p => `
                <div class="recent-project">
                    <strong>${p.name}</strong> ${p.version || ''}<br>
                    <small>${new Date(p.timestamp).toLocaleString()}</small>
                </div>
            `).join('');
        }

        // Check for auto-save on load
        if (hasAutoSave()) {
            document.getElementById('autoSaveAlert').style.display = 'block';
            log('Auto-saved project found', 'info');
        }

        // New project
        window.newProject = function() {
            const name = prompt('Enter project name:', 'My SK8 Project');
            if (!name) return;

            currentProject = projectManager.newProject(name);

            // Add stage to project
            stage.clearActors();
            projectManager.getCurrentProject().addStage('main', stage, 'Main Stage');

            log(`Created new project: ${name}`, 'info');
            updateStatus();
        };

        // Open project
        window.openProject = async function() {
            try {
                currentProject = await projectManager.openProjectFromPicker();

                // Restore stage
                stage.clearActors();
                const stageDef = currentProject.getStage('main');
                if (stageDef) {
                    // Add actors to stage
                    for (const actorId of stageDef.actorIds) {
                        const actor = currentProject.getActor(actorId);
                        if (actor) {
                            stage.addActor(actor);
                        }
                    }
                }

                stage.setNeedsRender();
                stage.startRendering();

                log(`Opened project: ${currentProject.getName()}`, 'info');
                updateStatus();
            } catch (error) {
                log(`Failed to open project: ${error.message}`, 'error');
            }
        };

        // Save project
        window.saveProject = function() {
            if (!currentProject) return;

            try {
                projectManager.saveProject();
                log(`Saved project: ${currentProject.getName()}`, 'info');
                updateStatus();
            } catch (error) {
                log(`Failed to save project: ${error.message}`, 'error');
            }
        };

        // Add actors to demonstrate
        window.addActors = function() {
            if (!currentProject) {
                alert('Please create or open a project first');
                return;
            }

            // Add some sample actors
            const rect = new SK8Rectangle();
            rect.setName('RedRectangle');
            rect.setBoundsRect({ left: 100, top: 100, right: 200, bottom: 200 });
            rect.setFillColor({ r: 255, g: 0, b: 0, a: 1 });
            rect.setFrameColor({ r: 0, g: 0, b: 0, a: 1 });
            stage.addActor(rect);
            currentProject.addActor('rect1', rect);

            const circle = new SK8Circle();
            circle.setName('BlueCircle');
            circle.setBoundsRect({ left: 300, top: 150, right: 400, bottom: 250 });
            circle.setFillColor({ r: 0, g: 0, b: 255, a: 1 });
            stage.addActor(circle);
            currentProject.addActor('circle1', circle);

            const text = new SK8Text('Hello SK8!');
            text.setName('HelloText');
            text.setBoundsRect({ left: 250, top: 350, right: 550, bottom: 400 });
            text.setFillColor({ r: 0, g: 128, b: 0, a: 1 });
            stage.addActor(text);
            currentProject.addActor('text1', text);

            projectManager.markDirty();
            stage.setNeedsRender();

            log('Added 3 sample actors', 'info');
            updateStatus();
        };

        // Export as JSON
        window.exportJSON = function() {
            if (!currentProject) {
                alert('No project to export');
                return;
            }

            const json = exportProjectAsJSON(currentProject);

            // Show in a new window
            const win = window.open('', '_blank');
            win.document.write('<pre>' + json + '</pre>');
            win.document.title = `${currentProject.getName()} - JSON`;

            log('Exported project as JSON', 'info');
        };

        // View project data
        window.viewProject = function() {
            if (!currentProject) {
                alert('No project loaded');
                return;
            }

            const data = {
                name: currentProject.getName(),
                version: currentProject.getVersion(),
                metadata: currentProject.getMetadata(),
                stats: currentProject.getStats(),
                stages: currentProject.getStageIds(),
                actors: currentProject.getActorIds(),
            };

            console.log('Project Data:', data);
            alert('Project data logged to console (F12)');
        };

        // Clear project
        window.clearProject = function() {
            if (!currentProject) return;

            if (!confirm('Clear all actors from project?')) return;

            currentProject.clear();
            stage.clearActors();
            stage.setNeedsRender();
            projectManager.markDirty();

            log('Cleared project', 'warn');
            updateStatus();
        };

        // Recover from auto-save
        window.recoverAutoSave = function() {
            try {
                currentProject = projectManager.recoverFromAutoSave();

                if (currentProject) {
                    // Restore stage
                    stage.clearActors();
                    const stageDef = currentProject.getStage('main');
                    if (stageDef) {
                        for (const actorId of stageDef.actorIds) {
                            const actor = currentProject.getActor(actorId);
                            if (actor) {
                                stage.addActor(actor);
                            }
                        }
                    }

                    stage.setNeedsRender();
                    stage.startRendering();

                    log('Recovered project from auto-save', 'info');
                    document.getElementById('autoSaveAlert').style.display = 'none';
                } else {
                    log('No auto-save found', 'warn');
                }

                updateStatus();
            } catch (error) {
                log(`Failed to recover: ${error.message}`, 'error');
            }
        };

        // Listen for project changes
        projectManager.onProjectChange((project) => {
            currentProject = project;
            updateStatus();
        });

        projectManager.onDirtyStateChange(() => {
            updateStatus();
        });

        // Start rendering
        stage.startRendering();

        // Initial update
        updateStatus();
        log('SK8 Project Demo initialized', 'info');
    </script>
</body>
</html>
