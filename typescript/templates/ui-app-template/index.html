<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK8 UI Application Template</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f5f5f5; overflow: hidden; }

        .app-container { display: flex; flex-direction: column; height: 100vh; }

        /* Menu Bar */
        .menubar { background: #2c3e50; color: white; padding: 8px 15px; display: flex; gap: 20px; }
        .menu-item { cursor: pointer; padding: 5px 10px; border-radius: 4px; transition: 0.2s; }
        .menu-item:hover { background: rgba(255, 255, 255, 0.1); }

        /* Toolbar */
        .toolbar { background: #34495e; color: white; padding: 10px 15px; display: flex; gap: 10px; align-items: center; }
        .toolbar button { padding: 8px 15px; border: none; background: #4a5568; color: white; border-radius: 4px; cursor: pointer; }
        .toolbar button:hover { background: #667eea; }
        .toolbar .separator { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.2); }

        /* Main Area */
        .main-area { flex: 1; display: flex; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 250px; background: white; border-right: 1px solid #ddd; overflow-y: auto; }
        .sidebar h3 { padding: 15px; background: #f8f9fa; border-bottom: 1px solid #ddd; margin: 0; }
        .sidebar-content { padding: 15px; }

        /* Canvas Area */
        .canvas-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #e0e0e0; padding: 20px; }
        #canvas { background: white; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); }

        /* Properties Panel */
        .properties { width: 280px; background: white; border-left: 1px solid #ddd; overflow-y: auto; }
        .properties h3 { padding: 15px; background: #f8f9fa; border-bottom: 1px solid #ddd; margin: 0; }
        .properties-content { padding: 15px; }
        .property { margin-bottom: 15px; }
        .property label { display: block; margin-bottom: 5px; font-size: 13px; color: #666; }
        .property input, .property select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }

        /* Status Bar */
        .statusbar { background: #2c3e50; color: white; padding: 5px 15px; font-size: 12px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Menu Bar -->
        <div class="menubar">
            <div class="menu-item">File</div>
            <div class="menu-item">Edit</div>
            <div class="menu-item">View</div>
            <div class="menu-item">Tools</div>
            <div class="menu-item">Help</div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <button>New</button>
            <button>Open</button>
            <button>Save</button>
            <div class="separator"></div>
            <button>Undo</button>
            <button>Redo</button>
            <div class="separator"></div>
            <button>Tool 1</button>
            <button>Tool 2</button>
        </div>

        <!-- Main Area -->
        <div class="main-area">
            <!-- Sidebar -->
            <div class="sidebar">
                <h3>Navigation</h3>
                <div class="sidebar-content">
                    <p>Sidebar content here...</p>
                    <ul style="list-style: none; padding: 0;">
                        <li style="padding: 8px; cursor: pointer; border-radius: 4px;">Item 1</li>
                        <li style="padding: 8px; cursor: pointer; border-radius: 4px;">Item 2</li>
                        <li style="padding: 8px; cursor: pointer; border-radius: 4px;">Item 3</li>
                    </ul>
                </div>
            </div>

            <!-- Canvas Area -->
            <div class="canvas-area">
                <canvas id="canvas" width="800" height="600"></canvas>
            </div>

            <!-- Properties Panel -->
            <div class="properties">
                <h3>Properties</h3>
                <div class="properties-content">
                    <div class="property">
                        <label>Name</label>
                        <input type="text" placeholder="Actor name">
                    </div>
                    <div class="property">
                        <label>X Position</label>
                        <input type="number" value="0">
                    </div>
                    <div class="property">
                        <label>Y Position</label>
                        <input type="number" value="0">
                    </div>
                    <div class="property">
                        <label>Width</label>
                        <input type="number" value="100">
                    </div>
                    <div class="property">
                        <label>Height</label>
                        <input type="number" value="100">
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="statusbar">
            <div>Ready</div>
            <div>X: 0, Y: 0</div>
        </div>
    </div>

    <script type="module">
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Initialize
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Your SK8 application code here
        console.log('SK8 UI Application Template ready!');

        // Example: Track mouse position
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.round(e.clientX - rect.left);
            const y = Math.round(e.clientY - rect.top);
            document.querySelector('.statusbar div:last-child').textContent = `X: ${x}, Y: ${y}`;
        });
    </script>
</body>
</html>
