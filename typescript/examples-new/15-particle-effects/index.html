<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SK8 Example 15: Particle Effects</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #16213e; padding: 20px; overflow-y: auto; }
        .canvas-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #canvas { border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        h2 { margin: 0 0 20px; color: #4ECDC4; }
        .effect-btn { width: 100%; padding: 12px; margin: 8px 0; border: none; background: #0f3460; color: white; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .effect-btn:hover { background: #533483; }
        .effect-btn.active { background: #4ECDC4; color: #1a1a2e; }
        .control { margin: 15px 0; }
        .control label { display: block; margin-bottom: 5px; font-size: 13px; color: #a0a0a0; }
        .control input[type="range"] { width: 100%; }
        .control-value { float: right; color: #4ECDC4; }
        .stats { margin-top: 20px; padding: 15px; background: #0f3460; border-radius: 6px; font-size: 12px; }
        .stats div { margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>✨ Particle Effects</h2>

            <div style="margin-bottom: 30px;">
                <button class="effect-btn active" onclick="selectEffect('fireworks')">🎆 Fireworks</button>
                <button class="effect-btn" onclick="selectEffect('snow')">❄️ Snow</button>
                <button class="effect-btn" onclick="selectEffect('rain')">🌧️ Rain</button>
                <button class="effect-btn" onclick="selectEffect('fire')">🔥 Fire</button>
                <button class="effect-btn" onclick="selectEffect('stars')">⭐ Stars</button>
            </div>

            <div class="control">
                <label>Particle Count <span class="control-value" id="countValue">100</span></label>
                <input type="range" id="countSlider" min="10" max="500" value="100" oninput="updateCount(this.value)">
            </div>

            <div class="control">
                <label>Speed <span class="control-value" id="speedValue">1.0</span></label>
                <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1" oninput="updateSpeed(this.value)">
            </div>

            <div class="control">
                <label>Size <span class="control-value" id="sizeValue">3</span></label>
                <input type="range" id="sizeSlider" min="1" max="10" value="3" oninput="updateSize(this.value)">
            </div>

            <div class="stats">
                <div><strong>Performance:</strong></div>
                <div>FPS: <span id="fps">60</span></div>
                <div>Particles: <span id="particleCount">0</span></div>
            </div>
        </div>

        <div class="canvas-area">
            <canvas id="canvas" width="1200" height="800"></canvas>
        </div>
    </div>

    <script type="module">
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let currentEffect = 'fireworks';
        let config = {
            count: 100,
            speed: 1.0,
            size: 3
        };

        class Particle {
            constructor(x, y, vx, vy, color, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
                this.size = config.size;
            }

            update() {
                this.x += this.vx * config.speed;
                this.y += this.vy * config.speed;
                this.life--;

                switch(currentEffect) {
                    case 'fireworks':
                        this.vy += 0.2; // Gravity
                        break;
                    case 'snow':
                        this.vy += 0.05;
                        this.vx = Math.sin(this.y * 0.01) * 0.5;
                        break;
                    case 'fire':
                        this.vy -= 0.5;
                        this.vx += (Math.random() - 0.5) * 0.2;
                        break;
                }
            }

            render() {
                const alpha = this.life / this.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            isDead() {
                return this.life <= 0 || this.y > canvas.height || this.y < 0 || this.x < 0 || this.x > canvas.width;
            }
        }

        function createFireworks() {
            const x = Math.random() * canvas.width;
            const y = canvas.height * 0.3;
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#FFD93D'];

            for (let i = 0; i < 30; i++) {
                const angle = (Math.PI * 2 * i) / 30;
                const speed = 2 + Math.random() * 3;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, vx, vy, color, 60));
            }
        }

        function createSnow() {
            if (particles.length < config.count) {
                const x = Math.random() * canvas.width;
                const y = -10;
                const vx = 0;
                const vy = 1 + Math.random() * 2;
                particles.push(new Particle(x, y, vx, vy, '#FFFFFF', 500));
            }
        }

        function createRain() {
            if (particles.length < config.count) {
                const x = Math.random() * canvas.width;
                const y = -10;
                const vx = 2;
                const vy = 8 + Math.random() * 4;
                particles.push(new Particle(x, y, vx, vy, '#4A90E2', 200));
            }
        }

        function createFire() {
            if (particles.length < config.count) {
                const x = canvas.width / 2 + (Math.random() - 0.5) * 100;
                const y = canvas.height - 50;
                const vx = (Math.random() - 0.5) * 2;
                const vy = -2 - Math.random() * 3;
                const colors = ['#FF6B00', '#FF8800', '#FFAA00', '#FF0000'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, vx, vy, color, 60));
            }
        }

        function createStars() {
            if (particles.length < config.count) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const vx = 0;
                const vy = 0;
                particles.push(new Particle(x, y, vx, vy, '#FFFFFF', 200 + Math.random() * 100));
            }
        }

        function update() {
            // Create new particles based on effect
            switch(currentEffect) {
                case 'snow': createSnow(); break;
                case 'rain': createRain(); break;
                case 'fire': createFire(); break;
                case 'stars': createStars(); break;
            }

            // Update existing particles
            particles.forEach(p => p.update());
            particles = particles.filter(p => !p.isDead());

            // Special: fireworks spawn periodically
            if (currentEffect === 'fireworks' && Math.random() < 0.02) {
                createFireworks();
            }
        }

        function render() {
            // Clear with fade effect
            ctx.fillStyle = currentEffect === 'fire' ? 'rgba(26, 26, 46, 0.1)' : 'rgba(26, 26, 46, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render particles
            particles.forEach(p => p.render());
        }

        let lastTime = Date.now();
        let fps = 60;

        function gameLoop() {
            update();
            render();

            // Calculate FPS
            const now = Date.now();
            const delta = now - lastTime;
            lastTime = now;
            fps = Math.round(1000 / delta);

            // Update stats
            document.getElementById('fps').textContent = fps;
            document.getElementById('particleCount').textContent = particles.length;

            requestAnimationFrame(gameLoop);
        }

        window.selectEffect = function(effect) {
            currentEffect = effect;
            particles = [];
            document.querySelectorAll('.effect-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        };

        window.updateCount = function(value) {
            config.count = parseInt(value);
            document.getElementById('countValue').textContent = value;
        };

        window.updateSpeed = function(value) {
            config.speed = parseFloat(value);
            document.getElementById('speedValue').textContent = value;
        };

        window.updateSize = function(value) {
            config.size = parseInt(value);
            document.getElementById('sizeValue').textContent = value;
        };

        gameLoop();
        console.log('Particle effects loaded!');
        console.log('Try different effects and adjust the parameters!');
    </script>
</body>
</html>
