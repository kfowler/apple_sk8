name: Nightly

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # Extended test suite
  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create stress test script
        run: |
          cat > stress-test.js << 'EOF'
          // Stress test for SK8 - runs extended test scenarios
          const { performance } = require('perf_hooks');

          console.log('Running stress tests...');

          // Test 1: Memory allocation stress
          console.log('\n1. Memory allocation test');
          const start1 = performance.now();
          const arrays = [];
          for (let i = 0; i < 1000; i++) {
            arrays.push(new Array(1000).fill(i));
          }
          const end1 = performance.now();
          console.log(`   Allocated 1M elements in ${(end1 - start1).toFixed(2)}ms`);

          // Test 2: Repeated operations
          console.log('\n2. Repeated operations test');
          const start2 = performance.now();
          let sum = 0;
          for (let i = 0; i < 10000000; i++) {
            sum += i;
          }
          const end2 = performance.now();
          console.log(`   Completed 10M operations in ${(end2 - start2).toFixed(2)}ms`);

          // Test 3: Object creation stress
          console.log('\n3. Object creation test');
          const start3 = performance.now();
          const objects = [];
          for (let i = 0; i < 100000; i++) {
            objects.push({ id: i, name: `Object${i}`, value: Math.random() });
          }
          const end3 = performance.now();
          console.log(`   Created 100K objects in ${(end3 - start3).toFixed(2)}ms`);

          console.log('\n✅ Stress tests completed successfully');
          EOF

      - name: Run stress tests
        run: node stress-test.js

      - name: Run extended test suite
        run: npm run test -- --maxWorkers=2 --testTimeout=30000

  # Performance benchmarks
  performance-regression:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build && npx webpack --mode production

      - name: Create performance benchmark
        run: |
          cat > benchmark.js << 'EOF'
          const { performance } = require('perf_hooks');
          const fs = require('fs');

          console.log('Running performance benchmarks...\n');

          const results = {
            timestamp: new Date().toISOString(),
            benchmarks: []
          };

          // Benchmark 1: Bundle size
          const bundlePath = './dist/sk8.min.js';
          if (fs.existsSync(bundlePath)) {
            const stats = fs.statSync(bundlePath);
            const sizeKB = (stats.size / 1024).toFixed(2);
            console.log(`Bundle size: ${sizeKB}KB`);
            results.benchmarks.push({ name: 'Bundle Size', value: sizeKB, unit: 'KB' });
          }

          // Benchmark 2: Module load time
          const start = performance.now();
          try {
            // Simulate module loading overhead
            for (let i = 0; i < 100; i++) {
              const data = fs.readFileSync(bundlePath, 'utf8');
              const size = data.length;
            }
            const end = performance.now();
            const loadTime = ((end - start) / 100).toFixed(2);
            console.log(`Average module load time: ${loadTime}ms`);
            results.benchmarks.push({ name: 'Module Load Time', value: loadTime, unit: 'ms' });
          } catch (err) {
            console.error('Error loading module:', err.message);
          }

          // Save results
          fs.writeFileSync('benchmark-results.json', JSON.stringify(results, null, 2));
          console.log('\n✅ Benchmarks completed');
          console.log('\nResults saved to benchmark-results.json');
          EOF

      - name: Run benchmarks
        run: node benchmark.js

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: typescript/benchmark-results.json
          retention-days: 90

      - name: Compare with baseline
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat benchmark-results.json | jq -r '.benchmarks[] | "- \(.name): \(.value)\(.unit)"' >> $GITHUB_STEP_SUMMARY

  # Memory profiling
  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create memory profile script
        run: |
          cat > memory-profile.js << 'EOF'
          const { performance } = require('perf_hooks');

          console.log('Memory profiling...\n');

          function formatBytes(bytes) {
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
          }

          function getMemoryUsage() {
            const usage = process.memoryUsage();
            return {
              rss: usage.rss,
              heapTotal: usage.heapTotal,
              heapUsed: usage.heapUsed,
              external: usage.external
            };
          }

          console.log('Initial memory usage:');
          const initial = getMemoryUsage();
          console.log(`  RSS: ${formatBytes(initial.rss)}`);
          console.log(`  Heap Total: ${formatBytes(initial.heapTotal)}`);
          console.log(`  Heap Used: ${formatBytes(initial.heapUsed)}`);

          // Simulate long-running operations
          console.log('\nRunning long-running operations...');
          const data = [];
          for (let i = 0; i < 100; i++) {
            data.push(new Array(10000).fill(Math.random()));
            if (i % 10 === 0) {
              if (global.gc) {
                global.gc();
              }
            }
          }

          console.log('\nFinal memory usage:');
          const final = getMemoryUsage();
          console.log(`  RSS: ${formatBytes(final.rss)}`);
          console.log(`  Heap Total: ${formatBytes(final.heapTotal)}`);
          console.log(`  Heap Used: ${formatBytes(final.heapUsed)}`);

          console.log('\nMemory increase:');
          console.log(`  RSS: ${formatBytes(final.rss - initial.rss)}`);
          console.log(`  Heap Used: ${formatBytes(final.heapUsed - initial.heapUsed)}`);

          console.log('\n✅ Memory profiling completed');
          EOF

      - name: Run memory profiling
        run: node --expose-gc memory-profile.js

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=moderate || true

      - name: Check for outdated dependencies
        run: npm outdated || true

      - name: Generate security report
        run: |
          echo "# Security Audit Report" > security-report.md
          echo "" >> security-report.md
          echo "Generated: $(date)" >> security-report.md
          echo "" >> security-report.md
          echo "## npm audit" >> security-report.md
          npm audit --json > audit.json || true
          cat audit.json | jq -r '.vulnerabilities | to_entries[] | "- [\(.key)]: \(.value.severity) severity"' >> security-report.md || echo "No vulnerabilities found" >> security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: typescript/security-report.md
          retention-days: 90

  # Update dependencies
  update-dependencies:
    name: Check Dependency Updates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Check for updates
        run: |
          npm outdated --json > outdated.json || true

          if [ -s outdated.json ]; then
            echo "Updates available:"
            cat outdated.json | jq -r 'to_entries[] | "- \(.key): \(.value.current) → \(.value.latest)"'
          else
            echo "All dependencies are up to date"
          fi

      - name: Create update summary
        run: |
          echo "## Dependency Update Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -s outdated.json ]; then
            echo "### Updates Available" >> $GITHUB_STEP_SUMMARY
            cat outdated.json | jq -r 'to_entries[] | "- **\(.key)**: \(.value.current) → \(.value.latest)"' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All dependencies are up to date" >> $GITHUB_STEP_SUMMARY
          fi

  # Notification for failures
  notify-failure:
    name: Notify on Failure
    needs: [stress-tests, performance-regression, memory-profiling, security-audit, update-dependencies]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure summary
        run: |
          echo "# ❌ Nightly Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more nightly jobs failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Failed Jobs" >> $GITHUB_STEP_SUMMARY
          echo "- Stress Tests: ${{ needs.stress-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Regression: ${{ needs.performance-regression.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Memory Profiling: ${{ needs.memory-profiling.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Update Dependencies: ${{ needs.update-dependencies.result }}" >> $GITHUB_STEP_SUMMARY
